# A version tag (git tag v0.2.0 && git push origin v0.2.0) publishes the clinic image
# ghcr.io/reda-jok/dental-clinic:0.2.0, which ./update.sh 0.2.0 installs at a clinic.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/clinic/Dockerfile
          push: true
          tags: ghcr.io/reda-jok/dental-clinic:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
